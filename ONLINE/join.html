<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Find out how to join Ortus Chorale Ghana and share your voice.">
    <title>Join the Choir | Ortus Chorale Ghana</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="site.css">
</head>
<body>
    <div class="site-preloader" id="sitePreloader" role="status" aria-label="Loading Ortus Chorale Ghana"><span class="loader-emblem" aria-hidden="true">CV</span><span class="loader-ring" aria-hidden="true"></span></div>
    <header id="siteHeader"></header>
    <main>
        <section class="page-banner">
            <div class="page-width">
                <div class="eyebrow">Join the choir</div>
                <h1>Your voice belongs in the harmony.</h1>
                <p>We welcome singers who are ready to learn, grow, and serve through music. Tell us a little about yourself.</p>
            </div>
        </section>
        <section class="section page-width">
            <div class="join-form-wrap reveal">
                <form id="joinForm">
                    <div class="form-grid">
                        <div class="field"><label for="joinName">Full name</label><input id="joinName" name="name" autocomplete="name" required></div>
                        <div class="field"><label for="joinEmail">Email</label><input id="joinEmail" name="email" type="email" autocomplete="email" required></div>
                        <div class="field">
                            <label for="voicePart">Voice part</label>
                            <select id="voicePart" name="part"><option>Soprano</option><option>Alto</option><option>Tenor</option><option>Bass</option><option>Not sure</option></select>
                        </div>
                        <div class="field">
                            <label for="experience">Experience</label>
                            <select id="experience" name="experience"><option>Beginner</option><option>Intermediate</option><option>Advanced</option></select>
                        </div>
                        <div class="field full"><label for="joinMessage">Why would you like to join?</label><textarea id="joinMessage" name="message"></textarea></div>
                    </div>
                    <button class="button dark" type="submit">Send application <span aria-hidden="true">→</span></button>
                    <p class="form-note">The online form is not connected to email yet. To apply, contact <a class="text-link" href="mailto:hello@centralvoices.org">hello@centralvoices.org</a>.</p>
                    <p class="form-status" id="joinStatus" role="status" aria-live="polite"></p>
                </form>
            </div>
        </section>
    </main>
    <footer id="siteFooter"></footer>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script src="site.js"></script>
</body>
</html>
