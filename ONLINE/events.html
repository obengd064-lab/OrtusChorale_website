<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Upcoming concerts, gatherings, and community events from Ortus Chorale Ghana.">
    <title>Events | Ortus Chorale Ghana</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="site.css">
</head>
<body>
    <div class="site-preloader" id="sitePreloader" role="status" aria-label="Loading Ortus Chorale Ghana"><span class="loader-emblem" aria-hidden="true">CV</span><span class="loader-ring" aria-hidden="true"></span></div>
    <header id="siteHeader"></header>
    <main>
        <section class="page-banner">
            <div class="page-width">
                <div class="eyebrow">Come and listen</div>
                <h1>Gatherings filled with music.</h1>
                <p>Join us for concerts, worship, and community celebrations. Event details are updated by our staff.</p>
            </div>
        </section>
        <section class="section page-width">
            <div class="section-heading reveal">
                <div><div class="eyebrow">What's on</div><h2>Upcoming events</h2></div>
            </div>
            <div class="event-grid" id="eventGrid"></div>
        </section>
    </main>
    <footer id="siteFooter"></footer>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script src="site.js"></script>
</body>
</html>
